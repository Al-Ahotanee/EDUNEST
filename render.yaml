version: "1"

services:
  # ─── EduNest Unified Enterprise School OS (Fullstack Web Service) ───────────
  # Serves both the Vite React SPA and NestJS API from a single origin.
  # Eliminates all CORS issues, avoids domain mismatches, and runs on a single service.
  - type: web
    name: edunest
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build:all
    startCommand: cd apps/api && node scripts/start.js
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
        # Enter your Aiven MySQL Service URI on Render Dashboard:
        # mysql://avnadmin:PASSWORD@HOST:PORT/defaultdb?ssl-mode=REQUIRED
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SUPER_ADMIN_EMAIL
        value: admin@schoolerp.com
      - key: SUPER_ADMIN_PASSWORD
        value: password123
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
