version: "1"

services:
  # ─── 1. EduNest NestJS Backend API Web Service ──────────────────────────────
  - type: web
    name: edunest-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && cd apps/api && npm install && npx prisma generate && npm run build
    startCommand: cd apps/api && npx prisma db push --accept-data-loss && node dist/main.js
    healthCheckPath: /api/v1/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
        # Set to your Aiven MySQL Service URI:
        # mysql://avnadmin:PASSWORD@HOST:PORT/defaultdb?ssl-mode=REQUIRED
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://edunest-web-ctlm.onrender.com,https://edunest-web.onrender.com
      - key: SUPER_ADMIN_EMAIL
        value: admin@schoolerp.com
      - key: SUPER_ADMIN_PASSWORD
        value: password123
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false

  # ─── 2. EduNest Vite React Frontend (Static SPA) ────────────────────────────
  # Note: Static sites are served globally via Render CDN and cannot have a region or plan.
  - type: web
    name: edunest-web
    runtime: static
    buildCommand: npm install && cd apps/web && npm install && npm run build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://edunest-api.onrender.com/api/v1
      - key: VITE_APP_NAME
        value: EduNest
